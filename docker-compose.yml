# 自托管「任务 + 财务」系统
# 服务：NPM(反代/HTTPS) · ddns-go(动态DNS) · Vikunja(任务) · ezBookkeeping(财务) · n8n(桥接)
# 所有密钥/域名走环境变量（.env，不入库，见 .gitignore）。
# 镜像版本锁定在 .env.example（随文件复制为 .env），compose 用 ${xxx_VERSION} 引用。
# 运行时数据全部落在 ./data/ 下（已 gitignore），首次启动见底部 mkdir 命令。

networks:
  appnet:
    driver: bridge

services:
  # ---- 唯一对公网开放 80/443 ----
  # ⚠️ 安全：NPM 管理后台(81)与 ddns-go 管理后台(9876) 已绑定 127.0.0.1（仅本机回环），
  #    不再暴露到 LAN/WAN（🔴2）。需从其他机器访问请改用 SSH 隧道，或显式改为 192.168.x.x:81:81。
  npm:
    image: jc21/nginx-proxy-manager:${NPM_VERSION}
    container_name: npm
    ports:
      - "80:80"
      - "443:443"
      # NPM 管理后台：仅绑定本机回环，禁止对 LAN/WAN 暴露（🔴2 / CVE-2026-40519 缓解）。
      # 需从其他机器访问请用 SSH 隧道：ssh -L 81:127.0.0.1:81 user@nas，或改为 192.168.x.x:81:81 指定 LAN IP。
      - "127.0.0.1:81:81"
    volumes:
      - ./data/npm/data:/data
      - ./data/npm/letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    # 🟡21 容器加固：禁止提权 + 丢弃全部 Linux capabilities；NPM 需绑定 80/443 故仅补回 NET_BIND_SERVICE。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks: [appnet]
    # 健康检查：NPM 基于 alpine，用 wget --spider 探管理口 81（仅本机回环）。
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:81/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 日志轮转：避免容器日志无限增长撑满磁盘。
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- 动态 DNS（仅内网 :9876 管理）----
  ddns-go:
    image: jeessy/ddns-go:${DDNS_VERSION}
    container_name: ddns-go
    ports:
      # ddns-go 管理后台：仅绑定本机回环（🔴2）。LAN 访问用 SSH 隧道或改指定 LAN IP。
      - "127.0.0.1:9876:9876"
    volumes:
      - ./data/ddns-go:/root/.ddns-go
    restart: unless-stopped
    # 🟡21 容器加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    networks: [appnet]
    # 健康检查：ddns-go 基于 alpine，用 wget --spider 探管理口 9876（仅本机回环）。
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9876/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- 任务管理 Vikunja（不发布主机端口，仅 NPM 内网反代）----
  vikunja:
    # 方案 A：从 vendored 源码构建自定义镜像（已内置 TaskFIN 名称+图标），
    # 构建产物 tagged 为 taskfin-vikunja:local（见下方 image: 行）。
    # 如需回退到官方镜像：① 删除下方 build: 块；② 将 image: taskfin-vikunja:local
    #    改为注释，并取消下一行（官方镜像）的注释。回退后界面恢复原厂 Vikunja 名称/图标。
    # image: vikunja/vikunja:${VIKUNJA_VERSION}
    image: taskfin-vikunja:local
    build:
      context: ./vendor/vikunja
      dockerfile: Dockerfile
      args:
        RELEASE_VERSION: taskfin
    container_name: vikunja
    volumes:
      - ./data/vikunja/files:/app/vikunja/files
      - ./data/vikunja/db:/db
      - ./data/backup_staging:/backup   # vikunja dump 全量备份落盘目录（备份脚本读取）
    environment:
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      VIKUNJA_SERVICE_TIMEZONE: "${TZ}"
      # 对外访问地址（带 http(s)://，缺尾斜杠会由程序自动补）。
      # 影响邮件提醒里的任务链接、CalDAV 客户端发现、跨域(CORS)白名单。
      VIKUNJA_SERVICE_PUBLICURL: "https://tasks.${DOMAIN}/"
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
      VIKUNJA_SERVICE_EMAIL: "${QQ_EMAIL}@${MAIL_DOMAIN}"
      VIKUNJA_MAILER_ENABLED: "true"
      VIKUNJA_MAILER_HOST: "${MAIL_SMTP_HOST}"
      VIKUNJA_MAILER_PORT: "${MAIL_SMTP_PORT}"
      VIKUNJA_MAILER_USERNAME: "${QQ_EMAIL}@${MAIL_DOMAIN}"
      VIKUNJA_MAILER_PASSWORD: "${QQ_AUTH_CODE}"
      VIKUNJA_MAILER_FROMEMAIL: "${QQ_EMAIL}@${MAIL_DOMAIN}"
      VIKUNJA_MAILER_FORCESSL: "true"
      VIKUNJA_MAILER_SKIPTLSVERIFY: "false"
    restart: unless-stopped
    # 🟡21 容器加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [appnet]
    # 健康检查：vikunja 镜像是 scratch（无 shell/wget），用二进制自带的 healthcheck 子命令（检查 DB 连通性）。
    healthcheck:
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 日志轮转：避免容器日志无限增长撑满磁盘。
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- 财务管理 ezBookkeeping（不发布主机端口）----
  ezbookkeeping:
    # 方案 A：从 vendored 源码构建自定义镜像（已内置 TaskFIN 名称+图标），
    # 构建产物 tagged 为 taskfin-ezbookkeeping:local（见下方 image: 行）。
    # 如需回退到官方镜像：① 删除下方 build: 块；② 将 image: taskfin-ezbookkeeping:local
    #    改为注释，并取消下一行（官方镜像）的注释。回退后界面恢复原厂 ezBookkeeping 名称/图标。
    # image: mayswind/ezbookkeeping:${EZB_VERSION}
    image: taskfin-ezbookkeeping:local
    build:
      context: ./vendor/ezbookkeeping
      dockerfile: Dockerfile
    container_name: ezbookkeeping
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data/ezbookkeeping/data:/ezbookkeeping/data
      - ./data/ezbookkeeping/storage:/ezbookkeeping/storage
    environment:
      TZ: "${TZ}"
      # 必改：随机密钥，群晖 SSH 执行 `openssl rand -base64 32`
      EBK_SECURITY_SECRET_KEY: "${EZB_SECRET_KEY}"
      # 开启 API Token（n8n 桥接必需）
      EBK_SECURITY_ENABLE_API_TOKEN: "true"
      # 关闭公开注册（ezB 默认 enable_register=true，不关则他人可自建账号）
      EBK_SECURITY_ENABLE_REGISTER: "false"
      EBK_MAIL_SMTP_HOST: "${MAIL_SMTP_HOST}"
      EBK_MAIL_SMTP_PORT: "${MAIL_SMTP_PORT}"
      EBK_MAIL_SMTP_PROTOCOL: "smtps"
      EBK_MAIL_SMTP_USER: "${QQ_EMAIL}@${MAIL_DOMAIN}"
      EBK_MAIL_SMTP_PASSWD: "${QQ_AUTH_CODE}"
      EBK_MAIL_FROM_ADDRESS: "${QQ_EMAIL}@${MAIL_DOMAIN}"
      EBK_MAIL_FROM_NAME: "任务财务系统"
      # 访问地址（影响邮件内链接/头像/图片）
      EBK_SERVER_DOMAIN: "fin.${DOMAIN}"
      EBK_SERVER_ROOT_URL: "https://fin.${DOMAIN}"
      EBK_SERVER_ENABLE_GZIP: "true"
      # 数据导出开关（备份工作流 GET /api/data/export.csv 依赖此开关）
      EBK_DATA_ENABLE_EXPORT: "true"
      # 周期/计划交易（定期扣款闭环）开关：位于 [user] 段，变量名 EBK_USER_ENABLE_SCHEDULED_TRANSACTION
      # （拼接规则 EBK_<段>_<键>）；本快照 ini 已默认 true，此处显式声明使行为确定、不依赖 ini 默认值
      EBK_USER_ENABLE_SCHEDULED_TRANSACTION: "true"
    restart: unless-stopped
    # 🟡21 容器加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [appnet]
    # 健康检查：ezBookkeeping 镜像基于 alpine，自带 busybox wget；/healthz.json 挂在根路由（无 /api/v1 前缀）、免认证。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz.json || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 日志轮转：避免容器日志无限增长撑满磁盘。
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- 自动化桥接 n8n（不发布主机端口）----
  # 启动顺序：下方 depends_on 已改为「等待上游 healthcheck 通过」（condition: service_healthy），
  # 避免 n8n 首次启动早于 Vikunja/ezBookkeeping 就绪。
  n8n:
    image: n8nio/n8n:${N8N_VERSION}
    container_name: n8n
    volumes:
      - ./data/n8n:/home/node/.n8n
    depends_on:
      vikunja:
        condition: service_healthy
      ezbookkeeping:
        condition: service_healthy
    environment:
      TZ: "${TZ}"
      GENERIC_TIMEZONE: "${TZ}"
      # n8n 1.x 用内置 Owner 账号（首次登录设密码），不再用 N8N_BASIC_AUTH
      # P3：经 NPM(HTTPS) 反代时，口令 Cookie 需 Secure 属性才能写入，否则登录反复跳转
      N8N_SECURE_COOKIE: "true"
      N8N_PROTOCOL: "https"
      WEBHOOK_URL: "https://flow.${DOMAIN}"
      # n8n 凭证/变量加密密钥：必须显式设置并备份（见 .env），首次启动前确定，
      # 之后修改会导致已有凭证/变量无法解密。
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      # Webhook 静态密钥（单源）：注入 n8n 容器环境变量，Auth Guard 直接读 $env.WEBHOOK_SECRET，
      # 不再依赖 n8n 内部变量（D 项）。改 .env 后重启 n8n 即生效，无需改工作流。
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
      # D1-A：桥接所需的 token / 分类 / 账户 ID 改为「容器环境变量单源」，由 compose 注入 n8n 容器，
      # 工作流内用 $env.XXX 读取（不再依赖 n8n 内部 $vars，社区版不支持 Custom Variables）。
      # 注意：n8n 默认禁止节点读取环境变量，需显式放开（仅放开读，不影响其它安全设置）。
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      VIKUNJA_TOKEN: "${VIKUNJA_TOKEN}"
      EZB_TOKEN: "${EZB_TOKEN}"
      EZB_CAT_EXPENSE: "${EZB_CAT_EXPENSE}"
      EZB_CAT_LOAN: "${EZB_CAT_LOAN}"
      EZB_ACCOUNT_CASH_ID: "${EZB_ACCOUNT_CASH_ID}"
      EZB_ACCOUNT_DEPOSIT_ID: "${EZB_ACCOUNT_DEPOSIT_ID}"
      # 发件地址（与 Vikunja/ezB 共用 .env 的 QQ_EMAIL / MAIL_DOMAIN）
      QQ_EMAIL: "${QQ_EMAIL}"
      MAIL_DOMAIN: "${MAIL_DOMAIN}"
    restart: unless-stopped
    # 🟡21 容器加固
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    networks: [appnet]
    # 健康检查：n8n 镜像基于 debian，优先用 curl、缺失时回退 wget；/healthz 在容器端口 5678 返回 200。
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5678/healthz || wget -q -O /dev/null http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 日志轮转：避免容器日志无限增长撑满磁盘。
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ===== 首次启动（在仓库根目录执行）=====
# cp .env.example .env   # 然后填好真实值（包含镜像版本）
# mkdir -p data/npm/data data/npm/letsencrypt data/ddns-go \
#          data/vikunja/files data/vikunja/db \
#          data/ezbookkeeping/data data/ezbookkeeping/storage \
#          data/n8n data/backup_staging
# chown -R ${PUID:-1000}:${PGID:-1000} data/ezbookkeeping/data data/ezbookkeeping/storage data/vikunja/files data/vikunja/db data/n8n data/backup_staging
# （PUID/PGID 见 .env；群晖 DSM 的 docker 用户 UID 通常不是 1000，若启动报权限错请改为 DSM 实际 UID:GID）
# docker compose up -d
